<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Article preview component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <article class="post">
      <img
        src="assets/images/drawers.jpg"
        alt="drawers-alt"
        class="post-image"
      />

      <div class="post-content">
        <h2 class="post-title">
          Shift the overall look and feel by adding these wonderful touches to
          furniture in your home
        </h2>
        <p class="post-text">
          Ever been in a room and felt like something was missing? Perhaps it
          felt slightly bare and uninviting. I’ve got some simple tips to help
          you make any room feel complete.
        </p>
        <div class="post-author" id="post-author">
          <div class="author-details" id="author-details">
            <img
              src="assets/images/avatar-michelle.jpg"
              alt="avatar-alt"
              class="author-image"
            />
            <div class="author-info">
              <span class="author-name">Michelle Appleton</span>
              <span class="post-date">28 Jun 2020</span>
            </div>
          </div>
          <button class="share-btn" id="share-btn">
            <span class="share-icon" id="share-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div class="popup-share-links" id="popup-share-links">
          <span>SHARE</span>
          <a href="#" aria-label="Facebook"
            ><span class="social-icon social-facebook"></span
          ></a>
          <a href="#" aria-label="Twitter"
            ><span class="social-icon social-twitter"></span
          ></a>
          <a href="#" aria-label="Pinterest"
            ><span class="social-icon social-pinterest"></span
          ></a>
        </div>
      </div>
    </article>
  </body>
</html>
